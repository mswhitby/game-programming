name: C# practice checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: student
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify the checker
        run: python trusted/scripts/grade.py --self-test
      - name: Check submitted exercises
        if: github.event_name == 'pull_request'
        run: python trusted/scripts/grade.py --student-root student
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: csharp-feedback
          path: grading-report.json
